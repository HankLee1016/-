<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>編輯服務</title>
    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin-forms.css">
</head>
<body>
    <div class="page-bg"></div>
    <div class="container">
        <header class="hero-card">
            <div class="hero-copy">
                <span class="eyebrow">服務管理</span>
                <h1>編輯服務</h1>
                <p>更新服務資訊。</p>
            </div>
            <div class="hero-actions">
                <a class="button" href="/admin/services">返回服務列表</a>
                <a class="button" href="/logout">登出</a>
            </div>
        </header>

        <section class="card">
            <div class="card-title">
                <h2>服務編輯表單</h2>
            </div>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            {% if service %}
            <div class="service-id-info">
                <strong>服務代碼:</strong> {{ service.id }}
            </div>

            <form method="post" action="/admin/services/{{ service.id }}/edit">
                <div class="form-group">
                    <label for="service_name">服務名稱 <span style="color: red;">*</span></label>
                    <input type="text" id="service_name" name="service_name" required placeholder="輸入服務名稱" value="{{ service.service_name }}">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="service_type">服務類型 <span style="color: red;">*</span></label>
                        <select id="service_type" name="service_type" required>
                            {% if service.service_type not in need_types %}<option value="{{ service.service_type }}" selected>{{ service.service_type }}（舊分類，無法媒合）</option>{% endif %}
                            {% for t in need_types %}<option value="{{ t }}" {% if service.service_type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="status">開放狀態</label>
                        <select id="status" name="status">
                            <option value="開放申請" {% if service.status == '開放申請' %}selected{% endif %}>開放申請</option>
                            <option value="額滿" {% if service.status == '額滿' %}selected{% endif %}>額滿</option>
                            <option value="停止申請" {% if service.status == '停止申請' %}selected{% endif %}>停止申請</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="district">服務行政區</label>
                        <select id="district" name="district">
                            <option value="">（未指定）</option>
                            {% for d in districts %}<option value="{{ d }}" {% if service.district == d %}selected{% endif %}>{{ d }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="service_scope">服務範圍</label>
                        <select id="service_scope" name="service_scope">
                            <option value="本區" {% if service.service_scope not in ('全區', '全縣市', '全國') %}selected{% endif %}>僅服務所在行政區</option>
                            <option value="全區" {% if service.service_scope in ('全區', '全縣市', '全國') %}selected{% endif %}>全區皆可服務</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="target_group">服務對象</label>
                        <input type="text" id="target_group" name="target_group" placeholder="例如：低收入戶、獨居長者等" value="{{ service.target_group }}">
                    </div>
                    <div class="form-group">
                        <label for="contact">聯絡方式</label>
                        <input type="text" id="contact" name="contact" placeholder="電話或Email" value="{{ service.contact }}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">服務描述</label>
                    <textarea id="description" name="description" placeholder="詳細描述此服務的內容、目的、時間和其他重要資訊...">{{ service.description }}</textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" style="background-color: var(--primary); color: white;">更新服務</button>
                    <a href="/admin/services" style="background-color: var(--text-secondary); color: white; text-align: center;">取消</a>
                </div>
            </form>
            {% else %}
            <p>服務不存在。</p>
            <a class="button" href="/admin/services">返回服務列表</a>
            {% endif %}
        </section>
    </div>
</body>
</html>
